---
# pipeline name: general-task-update-notifier

jobs:
  - name: cf-release-notification
    plan:
      - in_parallel:
          - get: github-release
            resource: cf-cli-release
            trigger: true
          - get: pipeline-tasks
            params: { depth: 1 }
      - task: create-issue
        file: pipeline-tasks/gh-release-notifier.yml
        params:
          CLOSE_OLD_ISSUES: "true"
          DEPENDENCY_NAME: "cf-cli"
          GH_REPO: "https://github.com/cloud-gov/general-task"
          GH_TOKEN: ((cg-ci-bot-projects-ghtoken))
          PROJECT_NAME: "cloud.gov team"
          SQUAD_LABEL: "squad-platform"

  - name: bosh-release-notification
    plan:
      - in_parallel:
          - get: github-release
            resource: bosh-cli-release
            trigger: true
          - get: pipeline-tasks
            params: { depth: 1 }
      - task: create-issue
        file: pipeline-tasks/gh-release-notifier.yml
        params:
          CLOSE_OLD_ISSUES: "true"
          DEPENDENCY_NAME: "bosh-cli"
          GH_REPO: "https://github.com/cloud-gov/general-task"
          GH_TOKEN: ((cg-ci-bot-projects-ghtoken))
          PROJECT_NAME: "cloud.gov team"
          SQUAD_LABEL: "squad-platform"

  - name: terraform-release-notification
    plan:
      - in_parallel:
          - get: github-release
            resource: terraform-release
            trigger: true
          - get: pipeline-tasks
            params: { depth: 1 }
      - task: create-issue
        file: pipeline-tasks/gh-release-notifier.yml
        params:
          CLOSE_OLD_ISSUES: "true"
          DEPENDENCY_NAME: "terraform"
          GH_REPO: "https://github.com/cloud-gov/general-task"
          GH_TOKEN: ((cg-ci-bot-projects-ghtoken))
          PROJECT_NAME: "cloud.gov team"
          SQUAD_LABEL: "squad-platform"

  - name: credhub-release-notification
    plan:
      - in_parallel:
          - get: github-release
            resource: credhub-cli-release
            trigger: true
          - get: pipeline-tasks
            params: { depth: 1 }
      - task: create-issue
        file: pipeline-tasks/gh-release-notifier.yml
        params:
          CLOSE_OLD_ISSUES: "true"
          DEPENDENCY_NAME: "credhub-cli"
          GH_REPO: "https://github.com/cloud-gov/general-task"
          GH_TOKEN: ((cg-ci-bot-projects-ghtoken))
          PROJECT_NAME: "cloud.gov team"
          SQUAD_LABEL: "squad-platform"

resources:
  - name: cf-cli-release
    type: github-release
    check_every: 2h
    source:
      access_token: ((cg-ci-bot-ghtoken))
      owner: cloudfoundry
      repository: cli
      semver_constraint: "8.*"

  - name: bosh-cli-release
    type: github-release
    check_every: 2h
    source:
      access_token: ((cg-ci-bot-ghtoken))
      owner: cloudfoundry
      repository: bosh-cli
      semver_constraint: "7.*"

  - name: terraform-release
    type: github-release
    check_every: 2h
    source:
      access_token: ((cg-ci-bot-ghtoken))
      owner: hashicorp
      repository: terraform

  - name: credhub-cli-release
    type: github-release
    check_every: 2h
    source:
      access_token: ((cg-ci-bot-ghtoken))
      owner: cloudfoundry
      repository: credhub-cli

  - name: pipeline-tasks
    type: git
    icon: github-circle
    source:
      branch: main
      commit_verification_keys: ((cloud-gov-pgp-keys))
      paths: [gh-release-notifier.yml, gh-release-notifier.sh]
      uri: https://github.com/cloud-gov/pipeline-tasks.git

resource_types:
  - name: registry-image
    type: registry-image
    source:
      aws_access_key_id: ((ecr_aws_key))
      aws_secret_access_key: ((ecr_aws_secret))
      repository: registry-image-resource
      aws_region: us-gov-west-1
      tag: latest

  - name: github-release
    type: registry-image
    source:
      aws_access_key_id: ((ecr_aws_key))
      aws_secret_access_key: ((ecr_aws_secret))
      repository: github-release-resource
      aws_region: us-gov-west-1
      tag: latest

  - name: git
    type: registry-image
    source:
      aws_access_key_id: ((ecr_aws_key))
      aws_secret_access_key: ((ecr_aws_secret))
      repository: git-resource
      aws_region: us-gov-west-1
      tag: latest
